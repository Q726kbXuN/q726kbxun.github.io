    body {

    }

    .stats {

    #header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;

        margin-bottom: 4px;
    }

    .title {
        font-size: 160%;
        font-weight: bold;
        letter-spacing: 1px;
    }

    .byline {
        font-style: italic;
        color: #ccc;
    }

    .note {
        color: #ccc;
        font-size: 90%;
        margin-bottom: 8px;
        max-width: 60em;
    }

    #cluebar {

        background-color: #2a2a2a;

    }

    .layout {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-start;
    }

    #boardWrap {
        max-width: 100%;
        overflow: auto;
    }

    #controls {
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
    }

    #quads {
        display: inline-grid;
        grid-template-columns: auto auto;
        gap: 2px;
    }

    .quad {
        min-width: 9.5em;
        padding: 1px 6px;
        font-size: 75%;
        border-radius: 3px;
        background-color: #444;
        color: #ccc;
    }

    .quad.ok {
        background-color: #2e6b2e;
        color: #fff;
    }

    .quad.bad {
        background-color: #8b2a2a;
        color: #fff;
    }

    #message {
        font-size: 90%;
        min-height: 1.3em;
        margin-top: 4px;
    }

    #message.solved {
        color: #9e9;
        font-weight: bold;
    }

    .clueCol {
        width: 290px;
        flex: 0 0 auto;
    }

    .clueHead {
        font-weight: bold;
        margin-bottom: 4px;
    }

    .clues {
        max-height: 600px;
        overflow-y: auto;
        position: relative;
        scrollbar-color: #666 #2a2a2a;
    }

    .ClueCell, .ClueCellCur, .ClueCellCross {
        cursor: pointer;
        padding-left: 2.4em;
        position: relative;
        padding-top: 1px;
        padding-bottom: 1px;
    }

    .ClueCell:hover {
        background-color: #444;
    }

    .ClueCellCur {
        background-color: #ff0;
        color: #000;
    }

    .ClueCellCross {
        background-color: #554;
    }

    .num {
        left: 0em;
        width: 2em;
        text-align: right;
        font-weight: bold;
        position: absolute;
    }

    .noclue {
        color: #999;
    }

    .ClueCellCur .noclue {
        color: #555;
    }

    .Cell {
        fill: #fff;
    }

    .CellWord {
        fill: #ffff99;
    }

    .CellCur {
        fill: #ffcc00;
    }

    .qmark {
        fill: none;
    }

    .qmark.bad {
        fill: rgba(220, 0, 0, 0.16);
    }

    .qmark.ok {
        fill: rgba(0, 170, 0, 0.14);
    }

    .Board {
        display: block;
        font-family: arial, sans-serif;
        user-select: none;
        cursor: pointer;
    }

    #kb {

        top: 0;
        left: 0;
        width: 1px;
        height: 1px;

        border: 0;
        padding: 0;

function quadOf(r, c) {
    return QUADS.findIndex(q => r >= q.r0 && r < q.r1 && c >= q.c0 && c < q.c1);
}

function loadProgress() {
    try {
        const s = JSON.parse(localStorage.getItem(STORE_KEY));
        if (!s || !Array.isArray(s.fill) || s.fill.length !== H) {
            return;
        }
        for (let r = 0; r < H; r++) {
            for (let c = 0; c < W; c++) {
                const ch = (s.fill[r] || '')[c] || '';
                fill[r][c] = (isWhite(r, c) && /^[A-Z]$/.test(ch)) ? ch : '';
            }
        }
        if (s.cur && isWhite(s.cur.r, s.cur.c)) {
            cur = {r: s.cur.r, c: s.cur.c};
        }
        if (s.dir === 'A' || s.dir === 'D') {
            dir = s.dir;
        }
    } catch (e) {
        
    }
}

function saveProgress() {
    const note = document.getElementById('savenote');
    try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
            fill: fill.map(row => row.map(ch => ch || '.').join('')),
            cur: cur,
            dir: dir,
            saved: Date.now(),
        }));
        note.textContent = 'Progress is saved in this browser.';
    } catch (e) {
        note.textContent = 'Progress can\'t be saved in this browser.';
    }
}

function build() {
    CELL_ENTRY = [];
    for (let r = 0; r < H; r++) {
        CELL_ENTRY.push([]);
        fill.push([]);
        for (let c = 0; c < W; c++) {
            CELL_ENTRY[r].push({});
            fill[r].push('');
        }
    }
    const numbers = {};
    PUZZLE.entries.forEach((e, i) => {
        for (const [r, c] of entryCells(e)) {
            CELL_ENTRY[r][c][e.dir] = i;
        }
        numbers[key(e.row, e.col)] = e.num;
    });

    let html = '';
    html += '<svg id="board" class="Board" preserveAspectRatio="xMidYMin meet" ';
    html += 'xmlns="http://www.w3.org/2000/svg" ';
    html += 'viewBox="0 0 ' + (W * CELL + 6) + ' ' + (H * CELL + 6) + '">';
    html += '<g data-group="cells">';
    for (let r = 0; r < H; r++) {
        const y = 3 + CELL * r;
        for (let c = 0; c < W; c++) {
            const x = 3 + CELL * c;
            if (!isWhite(r, c)) {
                html += '<rect x="' + x + '" y="' + y + '" width="33" height="33"></rect>';
                continue;
            }
            const k = key(r, c);
            html += '<g data-key="' + k + '">';
            html += '<rect id="c' + k + '" class="Cell" x="' + x + '" y="' + y + '" width="33" height="33"></rect>';
            if (numbers[k] !== undefined) {
                html += '<text x="' + (x + 2) + '" y="' + (y + 11.5) + '" text-anchor="start" font-size="11">' + numbers[k] + '</text>';
            }
            html += '<text id="t' + k + '" x="' + (x + 16.5) + '" y="' + (y + 30.25) + '" text-anchor="middle" font-size="22"></text>';
            html += '</g>';
        }
    }
    html += '</g>';
    html += '<g pointer-events="none">';
    QUADS.forEach((q, i) => {
        html += '<rect id="q' + i + '" class="qmark" x="' + (3 + CELL * q.c0) + '" y="' + (3 + CELL * q.r0) + '" ';
        html += 'width="' + (CELL * (q.c1 - q.c0)) + '" height="' + (CELL * (q.r1 - q.r0)) + '"></rect>';
    });
    html += '</g>';
    let path = '';
    for (let x = 1; x < W; x++) {
        path += 'M' + (x * CELL + 3) + ',3l0,' + (H * CELL);
    }
    for (let y = 1; y < H; y++) {
        path += 'M3,' + (y * CELL + 3) + 'l' + (W * CELL) + ',0';
    }
    const midX = 3 + CELL * QUADS[1].c0, midY = 3 + CELL * QUADS[2].r0;
    html += '<g data-group="grid" pointer-events="none">';
    html += '<path d="' + path + '" stroke="dimgray" vector-effect="non-scaling-stroke"></path>';
    html += '<path d="M' + midX + ',3l0,' + (H * CELL) + 'M3,' + midY + 'l' + (W * CELL) + ',0" ';
    html += 'stroke="#3a7bd5" stroke-width="2" vector-effect="non-scaling-stroke"></path>';
    html += '<rect x="1.50" y="1.50" width="' + (W * CELL + 3) + '" height="' + (H * CELL + 3) + '" ';
    html += 'stroke="black" stroke-width="3" fill="none"></rect>';
    html += '</g></svg>';
    document.getElementById('boardWrap').innerHTML = html;

    document.getElementById('board').addEventListener('click', ev => {
        const g = ev.target.closest('g[data-key]');
        if (!g) {
            return;
        }
        const [r, c] = g.dataset.key.split(',').map(Number);
        if (cur && cur.r === r && cur.c === c) {
            toggleDir();
        } else {
            cur = {r: r, c: c};
            if (CELL_ENTRY[r][c][dir] === undefined) {
                dir = (dir === 'A') ? 'D' : 'A';
            }
            refreshSelection();
        }
        focusKeyboard();
    });

    for (const d of ['A', 'D']) {
        let list = '';
        PUZZLE.entries.forEach((e, i) => {
            if (e.dir !== d) {
                return;
            }
            list += '<div class="ClueCell" id="a' + i + '" data-idx="' + i + '">';
            list += '<span class="num">' + e.num + '</span>';
            list += e.clue ? escapeHtml(e.clue) : '<span class="noclue">-</span>';
            list += '</div>';
        });
        const box = document.getElementById(d === 'A' ? 'across' : 'down');
        box.innerHTML = list;
        box.addEventListener('click', ev => {
            const div = ev.target.closest('[data-idx]');
            if (div) {
                selectEntry(Number(div.dataset.idx));
                focusKeyboard();
            }
        });
    }

    document.getElementById('title').innerText = PUZZLE.title;
    const when = new Date(PUZZLE.date + 'T12:00:00').toLocaleDateString(undefined, {year: 'numeric', month: 'long', day: 'numeric'});
    document.getElementById('byline').innerText = 'by ' + PUZZLE.author + ' / ' + when;
    document.getElementById('note').innerText = PUZZLE.note || '';
}

function drawCell(r, c) {
    document.getElementById('t' + key(r, c)).textContent = fill[r][c];
}

function currentEntry() {
    if (!cur) {
        return null;
    }
    if (CELL_ENTRY[cur.r][cur.c][dir] === undefined) {
        dir = (dir === 'A') ? 'D' : 'A';
    }
    return CELL_ENTRY[cur.r][cur.c][dir];
}

function scrollWithin(box, el) {
    const top = el.offsetTop;
    if (top < box.scrollTop) {
        box.scrollTop = top;
    } else if (top + el.offsetHeight > box.scrollTop + box.clientHeight) {
        box.scrollTop = top + el.offsetHeight - box.clientHeight;
    }
}

function refreshSelection() {
    const want = new Map();
    const e = currentEntry();
    if (e !== null && e !== undefined) {
        for (const [r, c] of entryCells(PUZZLE.entries[e])) {
            want.set(key(r, c), 'CellWord');
        }
        want.set(key(cur.r, cur.c), 'CellCur');
    }
    for (const k of litCells) {
        if (!want.has(k)) {
            document.getElementById('c' + k).setAttribute('class', 'Cell');
        }
    }
    for (const [k, cls] of want) {
        document.getElementById('c' + k).setAttribute('class', cls);
    }
    litCells = new Set(want.keys());

    for (const i of litClues) {
        document.getElementById('a' + i).className = 'ClueCell';
    }
    litClues = [];
    const bar = document.getElementById('cluebar');
    if (e === null || e === undefined) {
        bar.innerHTML = '<span class="noclue">Click a square and type. Space: switch direction. Tab: next clue.</span>';
        return;
    }
    const other = CELL_ENTRY[cur.r][cur.c][dir === 'A' ? 'D' : 'A'];
    if (other !== undefined) {
        const div = document.getElementById('a' + other);
        div.className = 'ClueCellCross';
        scrollWithin(div.parentElement, div);
        litClues.push(other);
    }
    const div = document.getElementById('a' + e);
    div.className = 'ClueCellCur';
    scrollWithin(div.parentElement, div);
    litClues.push(e);
    const ent = PUZZLE.entries[e];
    bar.innerHTML = '<b>' + ent.num + ' ' + (ent.dir === 'A' ? 'Across' : 'Down') + '</b> ' +
        (ent.clue ? escapeHtml(ent.clue) : '<span class="noclue">-</span>');
    keepCellVisible();
}

function keepCellVisible() {
    const wrap = document.getElementById('boardWrap');
    if (!cur || wrap.scrollWidth <= wrap.clientWidth) {
        return;
    }
    const scale = document.getElementById('board').getBoundingClientRect().width / (W * CELL + 6);
    const left = (3 + CELL * cur.c) * scale, right = left + CELL * scale;
    if (left < wrap.scrollLeft) {
        wrap.scrollLeft = left - CELL * scale;
    } else if (right > wrap.scrollLeft + wrap.clientWidth) {
        wrap.scrollLeft = right - wrap.clientWidth + CELL * scale;
    }
}

function cellChanged(r, c) {
    drawCell(r, c);
    const q = quadOf(r, c);
    if (q >= 0 && quadResult[q]) {
        quadResult[q] = null;
    }
    updateQuads();
    document.getElementById('message').textContent = '';
    document.getElementById('message').className = '';
}

function setLetter(ch) {
    if (!cur) {
        return;
    }
    fill[cur.r][cur.c] = ch;
    cellChanged(cur.r, cur.c);
    const [dr, dc] = (dir === 'A') ? [0, 1] : [1, 0];
    if (isWhite(cur.r + dr, cur.c + dc)) {
        cur = {r: cur.r + dr, c: cur.c + dc};
    }
    refreshSelection();
    saveProgress();
    autoCheck();
}

function backspace() {
    if (!cur) {
        return;
    }
    if (!fill[cur.r][cur.c]) {
        const [dr, dc] = (dir === 'A') ? [0, 1] : [1, 0];
        if (isWhite(cur.r - dr, cur.c - dc)) {
            cur = {r: cur.r - dr, c: cur.c - dc};
        }
    }
    fill[cur.r][cur.c] = '';
    cellChanged(cur.r, cur.c);
    refreshSelection();
    saveProgress();
}

function clearCell() {
    if (cur) {
        fill[cur.r][cur.c] = '';
        cellChanged(cur.r, cur.c);
        saveProgress();
    }
}

function toggleDir() {
    if (!cur) {
        return;
    }
    const other = (dir === 'A') ? 'D' : 'A';
    if (CELL_ENTRY[cur.r][cur.c][other] !== undefined) {
        dir = other;
    }
    refreshSelection();
    saveProgress();
}

function move(dr, dc) {
    if (!cur) {
        return;
    }
    const want = (dc !== 0) ? 'A' : 'D';
    if (dir !== want && CELL_ENTRY[cur.r][cur.c][want] !== undefined) {
        dir = want;
    } else {
        let r = cur.r + dr, c = cur.c + dc;
        while (r >= 0 && r < H && c >= 0 && c < W && !isWhite(r, c)) {
            r += dr;
            c += dc;
        }
        if (!isWhite(r, c)) {
            return;
        }
        cur = {r: r, c: c};
        if (CELL_ENTRY[r][c][want] !== undefined) {
            dir = want;
        }
    }
    refreshSelection();
    saveProgress();
}

function selectEntry(i) {
    const e = PUZZLE.entries[i];
    const cells = entryCells(e);
    const target = cells.find(([r, c]) => !fill[r][c]) || cells[0];
    dir = e.dir;
    cur = {r: target[0], c: target[1]};
    refreshSelection();
    saveProgress();
}

function jumpEntry(step) {
    const n = PUZZLE.entries.length;
    const e = currentEntry();
    const from = (e === null || e === undefined) ? (step > 0 ? -1 : 0) : e;
    selectEntry((from + step + n) % n);
}

function focusKeyboard() {
    const kb = document.getElementById('kb');
    try {
        kb.focus({preventScroll: true});
    } catch (e) {
        kb.focus();
    }
    if (kb.value !== ' ') {
        kb.value = ' ';
    }
}

function clearAll() {
    if (!confirm('Clear all squares?')) {
        return;
    }
    for (let r = 0; r < H; r++) {
        for (let c = 0; c < W; c++) {
            if (isWhite(r, c)) {
                fill[r][c] = '';
                drawCell(r, c);
            }
        }
    }
    quadResult = QUADS.map(() => null);
    wasFull = false;
    updateQuads();
    document.getElementById('message').textContent = '';
    document.getElementById('message').className = '';
    saveProgress();
}

function quadLetters(q) {
    let letters = '', empty = 0;
    for (let r = q.r0; r < q.r1; r++) {
        for (let c = q.c0; c < q.c1; c++) {
            if (isWhite(r, c)) {
                if (fill[r][c]) {
                    letters += fill[r][c];
                } else {
                    empty++;
                }
            }
        }
    }
    return [letters, empty];
}

function updateQuads() {
    QUADS.forEach((q, i) => {
        const [, empty] = quadLetters(q);
        const box = document.getElementById('quad' + i);
        const mark = document.getElementById('q' + i);
        const res = quadResult[i];
        let text = q.label, cls = 'quad';
        if (res === 'ok') {
            text += ' \u2713';
            cls += ' ok';
        } else if (res === 'bad') {
            text += ' \u2717';
            cls += ' bad';
        } else if (empty) {
            text += ': ' + empty + ' empty';
        }
        box.textContent = text;
        box.className = cls;
        mark.setAttribute('class', 'qmark' + (res ? ' ' + res : ''));
    });
}

function runCheck() {
    QUADS.forEach((q, i) => {
        const [letters, empty] = quadLetters(q);
        if (empty) {
            quadResult[i] = null;
        } else {
            const h = slowHash(PUZZLE.check.salt + '|' + q.name + '|' + letters, PUZZLE.check.rounds);
            quadResult[i] = (h === q.hash) ? 'ok' : 'bad';
        }
    });
    updateQuads();
    const msg = document.getElementById('message');
    const solved = quadResult.every(r => r === 'ok');
    msg.textContent = solved ? 'Solved!' : (quadResult.some(r => r) ? '' : 'Fill a quarter to check it.');
    msg.className = solved ? 'solved' : '';
}

function checkAll() {
    document.getElementById('message').textContent = 'Checking...';
    document.getElementById('message').className = '';
    setTimeout(runCheck, 20);
}

function autoCheck() {
    const full = QUADS.every(q => quadLetters(q)[1] === 0);
    if (full && !wasFull) {
        checkAll();
    }
    wasFull = full;
}

function downloadBlob(data, fileName, mimeType) {
    const blob = new Blob([data], {type: mimeType});
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.style.display = 'none';
    a.click();
    a.remove();
    setTimeout(() => window.URL.revokeObjectURL(url), 1000);
}

function downloadPuz() {
    const p = {
        "width": W,
        "height": H,
        "fileVersion": "1.2c",
        "title": puz.cleanString(PUZZLE.title),
        "author": puz.cleanString(PUZZLE.author),
        "notepad": puz.cleanString(PUZZLE.note || ''),
        "solution": "",
        "state": "",
        "clues": [],
    };
    const starts = {};
    for (const e of PUZZLE.entries) {
        const k = key(e.row, e.col);
        starts[k] = starts[k] || {};
        starts[k][e.dir] = e;
    }
    for (let r = 0; r < H; r++) {
        for (let c = 0; c < W; c++) {
            if (!isWhite(r, c)) {
                p.solution += '.';
                p.state += '.';
                continue;
            }
            p.solution += fill[r][c] || 'X';
            p.state += '-';
            const here = starts[key(r, c)] || {};
            for (const d of ['A', 'D']) {
                if (here[d]) {
                    p.clues.push(puz.cleanString(here[d].clue || '-'));
                }
            }
        }
    }
    downloadBlob(puz.printBinaryFile(p), PUZZLE.title + ' ' + PUZZLE.date + '.puz', 'application/octet-stream');
}

function applyZoom() {
    let px = parseInt(document.getElementById('zoom').value, 10);
    if (!px) {
        const avail = Math.max(300, window.innerWidth - 32 - (window.innerWidth > 1300 ? 2 * 302 : 0));
        px = Math.max(8, Math.min(26, Math.floor(avail / W)));
    }
    const board = document.getElementById('board');
    const w = px * W;
    const h = w * (H * CELL + 6) / (W * CELL + 6);
    board.style.width = w + 'px';
    board.style.height = h + 'px';
    for (const id of ['across', 'down']) {
        document.getElementById(id).style.maxHeight = Math.max(300, Math.round(h) - 24) + 'px';
    }
    keepCellVisible();
}

document.addEventListener('keydown', ev => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey || !cur) {
        return;
    }
    const k = ev.key;
    if (ev.target && (ev.target.tagName === 'SELECT' || (ev.target.tagName === 'BUTTON' && (k === ' ' || k === 'Enter')))) {
        return;
    }
    let handled = true;
    if (/^[a-zA-Z]$/.test(k)) {
        setLetter(k.toUpperCase());
    } else if (k === 'Backspace') {
        backspace();
    } else if (k === 'Delete') {
        clearCell();
    } else if (k === 'ArrowLeft') {
        move(0, -1);
    } else if (k === 'ArrowRight') {
        move(0, 1);
    } else if (k === 'ArrowUp') {
        move(-1, 0);
    } else if (k === 'ArrowDown') {
        move(1, 0);
    } else if (k === 'Tab' || k === 'Enter') {
        jumpEntry(ev.shiftKey ? -1 : 1);
    } else if (k === ' ') {
        toggleDir();
    } else if (k === 'Escape') {
        cur = null;
        refreshSelection();
    } else {
        handled = false;
    }
    if (handled) {
        ev.preventDefault();
    }
});

window.addEventListener('resize', () => {
    if (document.getElementById('zoom').value === '0') {
        applyZoom();
    }
});

document.addEventListener('DOMContentLoaded', () => {
    build();
    loadProgress();
    for (let r = 0; r < H; r++) {
        for (let c = 0; c < W; c++) {
            if (isWhite(r, c)) {
                drawCell(r, c);
            }
        }
    }
    wasFull = QUADS.every(q => quadLetters(q)[1] === 0);
    applyZoom();
    updateQuads();
    refreshSelection();
    try {
        localStorage.getItem(STORE_KEY);
        document.getElementById('savenote').textContent = 'Progress is saved in this browser.';
    } catch (e) {
        document.getElementById('savenote').textContent = 'Progress can\'t be saved in this browser.';
    }

    const kb = document.getElementById('kb');
    kb.value = ' ';
    kb.addEventListener('beforeinput', ev => {
        if (ev.inputType && ev.inputType.startsWith('delete')) {
            ev.preventDefault();
            backspace();
        } else if (ev.data) {
            ev.preventDefault();
            for (const ch of ev.data.toUpperCase().replace(/[^A-Z]/g, '')) {
                setLetter(ch);
            }
        }
    });
    kb.addEventListener('input', () => {
        const letters = kb.value.toUpperCase().replace(/[^A-Z]/g, '');
        kb.value = ' ';
        for (const ch of letters) {
            setLetter(ch);
        }
    });
});
